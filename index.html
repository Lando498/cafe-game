<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cafe Tycoon</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #2b221c;
            color: white;
        }
        #infobartop {
            top: 0;
            right: 2vw;
            position: fixed;
            display: flex;
            align-items: center;
        }
        #orderwindow {
            background-color: rgb(63, 50, 42);
            position: fixed;
            top: 20%;
            height: 60%;
            width: 60%;
            left: 2vw;
            border-radius: 15px;
        }
        #sprite {
            background-color: rgb(216, 198, 174);
            height: 70%;
            width: 75%;
            position: absolute;
            top: 5%;
            left: 5%;
        }
        #spriteimg {
            width: 45%;
            height: 100%;
        }
        #textbubble {
            height: 30%;
            width: 45%;
            position: absolute;
            right: 5%;
            top: 20%;
            background-color: rgb(226, 183, 159);
            color: black;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 8px;
        }
        #counter {
            height: 25%;
            position: absolute;
            bottom: 0;
            background-image: url(image.png);
            background-size: cover;
            width: 100%;
        }
        #servetray {
            width: 20%;
            height: 10%;
            position: absolute;
            bottom: 12%;
            left: 15%;
            z-index: 10;
            cursor: pointer;
        }
        #drinkplaceholder {
            height: 135%;
            width: 25%;
            bottom: 40%;
            left: 35%;
            position: relative;
        }
        #activetickets {
            position: absolute;
            right: 10%;
            top: 15%;
            width: 20vw;
            height: 70vh;
            background-image: url(ticket.png);
            background-size: contain;
            color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        #drinkimg {
            height: 120px;
            width: 90px;
            position: relative;
            left: 75px;
        }
        #ingredientlist {
            width: 100%;
        }
        #ingredients {
            display: flex;
            position: absolute;
            bottom: 0;
        }
        .ingredient {
            height: 65px;
        }
        .ingredientimg {
            height: 50px;
            width: 50px;
            background-color: #2b221c;
        }

        #espressoskillcheck {
            display: none;
            position: absolute;
            bottom:  20px;
        }
        #espressocup {
            height: 100px;
            width: 100px;
            position: absolute;
            z-index: 1000;
            bottom: 0px;
            transform: translateZ(0); 
        }
    </style>
    <meta name="version" content="1.0.1"> 
</head>
<body>

    <h1 style="position: fixed; left: 2vw;">Cafe tycoon</h1>
    
    <div id="infobartop">
        <h2 style="padding-right: 2vw;" id="daydisplay">Day 1</h2>
        <h2 id="cashdisplay">Cash: $0.00</h2>
    </div>

    <div id="orderwindow">
        <div id="counter" class="placeholderimg">
            <div id="ingredients">
            <button id="espresso" class="ingredient">
                <img id="espressoimg" class="ingredientimg" src="portafilter.png">
                espresso
            </button>
            <button id="milk" class="ingredient">
                <img id="milkimg" class="ingredientimg" src="milk.png"> 
                milk
            </button>
            <button id="sugar" class="ingredient">
                <img id="sugarimg" class="ingredientimg" src="sugar.png">
                sugar
            </button>
            <button id="syrup" class="ingredient">
                <img id="syrupimg" class="ingredientimg" src="syrup.png">
                syrup
            </button>
            <button id="ice" class="ingredient">
                <img id="iceimg" class="ingredientimg" src="ice.png">
                ice
            </button>
            </div>
        </div>
        <div id="sprite" style="background-image: url(background.png); background-size: contain;">
            <img id="spriteimg">
            <div id="textbubble">
                <p id="spritespeech">Welcome to Cafe Tycoon! Click the serve tray to begin.</p>
            </div>
        </div>
        
        <button id="servetray">
            <div id="drinkplaceholder" class="placeholderimg"></div>
        </button>
    </div>
    <div id="espressoskillcheck">
        <img id="espressomachine">
        <h1 id="espressostatus"></h1>
        <button id="espressostart" style="position: relative; left: 100px; background-image: url(button.png); background-size: contain; height: 100px; width: 100px; background-color: transparent; border: none;"></button>
        <img id="espressocup" >
        <div id="coffeebar" style="position: absolute; bottom: 0; background-color: rgb(71, 49, 33); width: 100px; height: 10px; transform: translateZ(0); "></div>
    </div>
    <div id="activetickets">
        <div id="ticket">
            <h1 id="drinkname">No Active Order</h1>
            <img id="drinkimg">
            <ul id="ingredientlist">
                <li id="item1"></li>
                <li id="item2"></li>
                <li id="item3"></li>
                <li id="item4"></li>
                <li id="item5"></li>
            </ul>
        </div>
    </div>
<footer>
    <h5 style="position: absolute; bottom: 5px; right: 20px;">CREDITS: customer drawings were made by ascpixi, this project was made by me Barista498 for Hack Club crescent</h5>
</footer>
    <script>
    let gameDay = 1;
    let gameCash = 0.00;
    let isOrderActive = false;
    let currentOrderPrice = 0.00;
    let dailyorderscompleted = 0;
    let ingredientnumber = 0
    let ingredientsused = ["","","","",""]
    const espressobutton = document.getElementById("espresso")
    const milkbutton = document.getElementById("milk")
    const sugarbutton = document.getElementById("sugar")
    const syrupbutton = document.getElementById("syrup")
    const icebutton = document.getElementById("ice")
const drinklist = [
    {
        name: "espresso",
        price: 2.50,
        speech: "Just a standard single shot of espresso, please.",
        ingredients: ["espresso", "", "", "", ""]
    },
    {
        name: "doppio",
        price: 3.50,
        speech: "Make it a double! I need a strong doppio espresso shot.",
        ingredients: ["espresso", "espresso", "", "", ""]
    },
    {
        name: "espresso macchiato",
        price: 3.00,
        speech: "Can I get an espresso macchiato? Just a dash of milk over the top.",
        ingredients: ["espresso", "milk", "", "", ""]
    },
    {
        name: "cortado",
        price: 3.75,
        speech: "Hello. May I have a cortado? Equal parts espresso and milk.",
        ingredients: ["espresso", "espresso", "milk", "milk", ""]
    },
    {
        name: "flat white",
        price: 4.25,
        speech: "Can I get a flat white? Two shots of espresso with smooth milk.",
        ingredients: ["espresso", "espresso", "milk", "", ""]
    },
    {
        name: "caffe latte",
        price: 4.50,
        speech: "Hi! I'd like a classic hot caffe latte, please.",
        ingredients: ["espresso", "milk", "milk", "milk", ""]
    },
    {
        name: "flavoured latte",
        price: 5.00,
        speech: "Could I please get a hot milk latte with a shot of syrup?",
        ingredients: ["espresso", "milk", "milk", "syrup", ""]
    },
    {
        name: "iced latte",
        price: 4.50,
        speech: "It's warm today! Can I get a refreshing iced latte?",
        ingredients: ["espresso", "ice", "milk", "milk", ""]
    },
    {
        name: "iced flavoured latte",
        price: 5.00,
        speech: "Hey! Can I get a cold iced latte with syrup?",
        ingredients: ["espresso", "ice", "milk", "syrup", ""]
    },
    {
        name: "espresso romano",
        price: 3.25,
        speech: "Let me get an espresso romano. A single shot sweetened with sugar.",
        ingredients: ["espresso", "sugar", "", "", ""]
    },
    {
        name: "cubano",
        price: 3.50,
        speech: "Hola! Can I get a cubano? Double espresso brewed with sugar.",
        ingredients: ["espresso", "espresso", "sugar", "", ""]
    },
    {
        name: "vietnamese style iced coffee",
        price: 4.75,
        speech: "Could I get a sweet iced coffee? Espresso, ice, milk, and sugar.",
        ingredients: ["espresso", "ice", "milk", "sugar", ""]
    },
    {
        name: "shakerato",
        price: 4.00,
        speech: "Can you make me a shakerato? Espresso shaken with ice and syrup.",
        ingredients: ["espresso", "ice", "syrup", "", ""]
    },
    {
        name: "sweet shakerato",
        price: 4.25,
        speech: "I'd love a sweet shakerato! Espresso, ice, syrup, and extra sugar.",
        ingredients: ["espresso", "ice", "syrup", "sugar", ""]
    },
    {
        name: "the barista overkill",
        price: 5.50,
        speech: "Give me the ultimate recipe check. Throw every single ingredient into one iced cup!",
        ingredients: ["espresso", "milk", "sugar", "syrup", "ice"]
    }
];


    const customer = "customerwait.png"
    const customerrecieve = "customerget.png"
    const daydisplay = document.getElementById("daydisplay");
    const cashdisplay = document.getElementById("cashdisplay");
    const sprite = document.getElementById("spriteimg")
    const spritespeech = document.getElementById("spritespeech");
    const ticketdrinkname = document.getElementById("drinkname");
    const ticketdrinkimg = document.getElementById("drinkimg")
    const servebutton = document.getElementById("servetray");
    const drinkimg = document.querySelector(".drinkimg")
    const icedlatteimg = "iced latte.png"
    let drinkindex = Math.floor(Math.random() * drinklist.length);
    let targetdrink = drinklist[drinkindex];
    const drinkingredients = [
        document.getElementById("item1"),
        document.getElementById("item2"),
        document.getElementById("item3"),
        document.getElementById("item4"),
        document.getElementById("item5")
    ];

    function newcustomer() {
        sprite.src = 'customerwait.png';
        drinkindex = Math.floor(Math.random() * drinklist.length);
        targetdrink = drinklist[drinkindex];
        ticketdrinkimg.src = `${targetdrink.name}.png`;
        document.getElementById("drinkplaceholder").src = `${targetdrink.name}.png`;
        currentOrderPrice = targetdrink.price;
        isOrderActive = true;

        spritespeech.innerText = targetdrink.speech;
        ticketdrinkname.innerText = targetdrink.name;
        for (let i = 0; i < 5; i++) {
            if (targetdrink.ingredients[i] !== "") {
                drinkingredients[i].innerText = targetdrink.ingredients[i];
            } else {
                drinkingredients[i].innerText = ""; 
            }
        }
    }

function addingredient(name) {
    if (isOrderActive === false) return;
    
    if (ingredientnumber < 5) {
        ingredientsused[ingredientnumber] = name;
        ingredientnumber += 1;
        spritespeech.innerText = "Added " + name + "! Tray slots filled: " + ingredientnumber + "/5";
    }
}

function checkRecipe() {
    const cleanRequired = targetdrink.ingredients.filter(item => item !== "");
    const cleanUsed = ingredientsused.filter(item => item !== "");
    if (cleanUsed.length !== cleanRequired.length) {
        return false;
    }

    const sortedUsed = [...cleanUsed].sort();
    const sortedRequired = [...cleanRequired].sort();

    return sortedUsed.every((item, index) => item === sortedRequired[index]);
}

let tipchance = 0
let tipamount = 0
function checkoutcurrentcustomer() {
    tipchance = Math.random(1,3)
    tipamount = Math.random(1,10)
    if (checkRecipe() === true) {
        if (Math.round(tipchance) === 1) {
            if (Math.round(tipamount) > 0) {
            gameCash += Math.round(tipamount)
            spritespeech.innerText = "Hey! this is completely wrong!";
            }
        }
        
        gameCash += currentOrderPrice
        dailyorderscompleted += 1;
        cashdisplay.innerText = "Cash: $" + gameCash.toFixed(2);
        if (dailyorderscompleted === 5) {
            gameDay += 1;
            daydisplay.innerText = "Day " + gameDay;
            dailyorderscompleted = 0;
        }
        isOrderActive = false;
        sprite.src = 'customerget.png';
        spritespeech.innerText = "Thank you! Have an amazing day! Click the tray for the next order.";
        ticketdrinkname.innerText = "No Active Order";
        ticketdrinkimg.src = null;
        drinkingredients.forEach(item => item.innerText = "");
        ingredientsused = ["","","","",""];
        ingredientnumber = 0;
    
    } else {
        if (Math.round(tipchance) === 1) {
            if (gameCash > Math.round(tipamount)) {
                if (Math.round(tipamount) > 0) {
                gameCash -= Math.round(tipamount)
                spritespeech.innerText = "Hey! this is completely wrong!" + " customer stole $" + Math.round(tipamount) + " from the tip jar"; 
                }
            }
        } else {
            spritespeech.innerText = "Hey! this is completely wrong!";
        }
        cashdisplay.innerText = gameCash
        ingredientsused = ["","","","",""];
        ingredientnumber = 0;
        isOrderActive = false;
        ticketdrinkname.innerText = "No Active Order";
        drinkingredients.forEach(item => item.innerText = "");
        
    }
}
let isbrewing = false
const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
async function startespresso() {
    if (startespresso.isRunning) return;
    startespresso.isRunning = true;
    
    document.getElementById("coffeebar").style.height = "10px";
    let currentheight = 10;

    while (currentheight < 110) {
        if (isbrewing === true) {
            currentheight += 5;
            console.log(currentheight)
            if (currentheight > 100) {
                document.getElementById("espressocup").src = "coffeecupspill.png";
                document.getElementById("coffeebar").style.height = `100px`; 
            } else {
                document.getElementById("coffeebar").style.height = `${currentheight}px`; 
            }
            
            await sleep(100);
        } else {
            break; 
        }
    }
    if (currentheight >= 80 && currentheight < 90) {
        addingredient("espresso");
        console.log("Perfect pour!");
        document.getElementById("espressocup").src = "coffeecupspill.png";
        document.getElementById("espressoskillcheck").style.display = "None"
        document.getElementById("coffeebar").style.height = "10px";
    } else {
        console.log("Pour failed. Espresso cancelled.");
        await sleep(600); 
        document.getElementById("espressocup").src = "coffeecupspill.png";
        document.getElementById("espressoskillcheck").style.display = "None"
        document.getElementById("coffeebar").style.height = "10px";
    }

    startespresso.isRunning = false;
}
servebutton.addEventListener("click", function() {
    if (isOrderActive === false) {
        newcustomer();
    } else {
        checkoutcurrentcustomer();
    }
});

espressobutton.addEventListener("click", function() {
        document.getElementById("espressoskillcheck").style.display = "flex"
        document.getElementById("espressocup").src = "coffeecup.png";
});
milkbutton.addEventListener("click", function() { addingredient("milk"); });
sugarbutton.addEventListener("click", function() { addingredient("sugar"); });
syrupbutton.addEventListener("click", function() { addingredient("syrup"); });
icebutton.addEventListener("click", function() { addingredient("ice"); });
document.getElementById("espressostart").addEventListener("mousedown", function() {
isbrewing = true
startespresso()
})
document.getElementById("espressostart").addEventListener("mouseup", function() { 
isbrewing = false
})
    </script>
</body>
</html>
